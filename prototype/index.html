      g += `<rect x="${gx + b * k + 1.5}" y="${Y(v)}" width="${b - 3}" height="${Y(0) - Y(v)}" rx="2" fill="${RC[r]}" fill-opacity="${k === 1 ? .85 : .9}"><title>${c.label} · ${RN[r]}: ${pct(v)} of their hidden "worth more" features funded</title></rect>`;
    });
    pts.push([ml + bw * i + bw / 2, YD(mean(c.teams.map(t => t.decoys)))]);
  });
  if (pts.length > 1) g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  pts.forEach(p => { g += `<path d="M${p[0]} ${p[1] - 6} L${p[0] + 5.5} ${p[1] + 4} L${p[0] - 5.5} ${p[1] + 4} Z" fill="${INK}"/>`; });
  g += L(ml, Y(0), ml + pw, Y(0)) + L(ml, mt, ml, mt + ph) + L(ml + pw, mt, ml + pw, mt + ph);
  g += T(14, mt + ph / 2, 'share of hidden "worth more" features funded', {rot:-90, anchor:'middle', size:11});
  g += T(W - 8, mt + ph / 2, '"worth less" features funded (of 3)', {rot:90, anchor:'middle', size:11});
  return svg(W, H, g, 'Hidden features funded by discipline and decoys funded') +
    legend([[RC.ME, 'Mechanical'], [RC.MF, 'Manufacturing'], [RC.HF, 'Human Factors'], [INK, '"Worth less" funded (dashed, right axis)', 'line']]);
}

/* ---------- The four steps: % of findings still alive at each step ---------- */
function steps(D){
  const C = D.conds.filter(c => c.teams.length);
  if (!C.length) return empty();
  const S = [['spoken','1. Spoken'], ['heard','2. Heard'], ['integrated','3. Integrated'], ['actioned','4. Actioned']];
  const W = 560, H = 300, ml = 46, mr = 150, mt = 20, mb = 40, pw = W - ml - mr, ph = H - mt - mb;
  const X = i => ml + pw * i / 3, Y = v => mt + ph - v * ph;
  let g = '';
  [0, .25, .5, .75, 1].forEach(v => { g += L(ml, Y(v), ml + pw, Y(v), {c:GRID}) + T(ml - 7, Y(v) + 4, pct(v), {anchor:'end', size:11}); });
  S.forEach(([k, l], i) => { g += L(X(i), mt, X(i), mt + ph, {c:GRID}) + T(X(i), H - mb + 22, l, {anchor:'middle', size:12.5, fill:INK}); });
  const ends = [];
  C.forEach(c => {
    const F = c.teams.reduce((a, t) => a + t.facts, 0) || 1;
    const v = S.map(([k]) => c.teams.reduce((a, t) => a + t.steps[k], 0) / F);
    g += `<polyline points="${v.map((y, i) => `${X(i)},${Y(y)}`).join(' ')}" fill="none" stroke="${c.color}" stroke-width="3" stroke-linejoin="round"/>`;
    v.forEach((y, i) => { g += `<circle cx="${X(i)}" cy="${Y(y)}" r="4.5" fill="#fff" stroke="${c.color}" stroke-width="2.5"><title>${c.label} · ${S[i][1]}: ${pct(y)}</title></circle>`; });
    ends.push([Y(v[3]), c, v[3]]);
  });
  ends.sort((a, b) => a[0] - b[0]);
  let last = -99;
  ends.forEach(([y0, c, v]) => { const y = Math.max(y0, last + 16); last = y; if (Math.abs(y - y0) > 2) g += L(X(3) + 5, y0, X(3) + 10, y, {c:c.color}); g += T(X(3) + 12, y + 4, `${c.label} ${pct(v)}`, {size:11.5, weight:700, fill:c.color}); });
  return svg(W, H, g, 'Findings that survive each of the four steps');
}

/* ---------- Points lost, stacked from 0 to 448 ---------- */
function pointsLost(D){
  const C = D.conds.filter(c => c.teams.length);
  if (!C.length) return empty();
  const SEG = [['final','Final score', null], ['other','Final pick: budget / other', '#c9ccd6'], ['wrong','Final pick: wrong info', '#e2a33b'],
    ['ni','Not integrated', '#d77a86'], ['nh','Not heard', '#b04a5a'], ['ns','Not spoken', '#6f2232']];
  const W = 1100, rowH = 46, ml = 160, mr = 110, mt = 22, H = mt + C.length * rowH + 36, pw = W - ml - mr;
  const tot = Math.max(D.opt, ...C.map(c => { const m = k => Math.max(0, mean(c.teams.map(t => t.lost[k])) || 0); return (mean(c.teams.map(t => t.pts)) || 0) + m('other') + m('wrong') + m('ni') + m('nh') + m('ns'); }));
  const X = v => ml + v / tot * pw;
  let g = '';
  [0, 100, 200, 300, 400, D.opt].forEach(v => { g += L(X(v), mt - 4, X(v), mt + C.length * rowH, {c:GRID}) + T(X(v), mt + C.length * rowH + 16, v, {anchor:'middle', size:11}); });
  g += L(X(D.naive_pts), mt - 6, X(D.naive_pts), mt + C.length * rowH, {c:'#4a5060', dash:'6 4'}) + T(X(D.naive_pts), mt - 8, `shared table only (${D.naive_pts})`, {anchor:'middle', size:10.5});
  C.forEach((c, i) => {
    const m = k => mean(c.teams.map(t => t.lost[k])) || 0;
    const vals = {final:mean(c.teams.map(t => t.pts)), other:Math.max(0, m('other')), wrong:m('wrong'), ni:m('ni'), nh:m('nh'), ns:m('ns')};
    const y = mt + i * rowH + 8, h = rowH - 18;
    g += T(ml - 10, y + h / 2 + 5, c.label, {anchor:'end', size:13, fill:INK, weight:700});
    let x = 0;
    SEG.forEach(([k, l, col]) => {
      const v = vals[k]; if (!(v > 0)) return;
      g += `<rect x="${X(x)}" y="${y}" width="${Math.max(0, X(x + v) - X(x))}" height="${h}" fill="${col || c.color}" ${k === 'final' ? '' : 'fill-opacity=".92"'}><title>${c.label} · ${l}: ${v.toFixed(0)} points</title></rect>`;
      if (X(x + v) - X(x) > 30) g += T((X(x) + X(x + v)) / 2, y + h / 2 + 4, v.toFixed(0), {anchor:'middle', size:11.5, fill:k === 'other' ? INK : '#fff', weight:700});
      x += v;
    });
    if (m('other') < -0.5) g += T(ml - 10, y + h / 2 + 18, `+${(-m('other')).toFixed(0)} pts by luck`, {anchor:'end', size:10.5, fill:'#117733'});
  });
  return svg(W, H, g, 'Points lost at each step') + legend(SEG.map(([k, l, col]) => [col || '#255E4B', k === 'final' ? 'Final score (condition color)' : l]));
}

/* ---------- Liked it vs got it right ---------- */
function satisfaction(D){
  const C = D.conds.filter(c => c.teams.some(t => t.sat != null));
  if (!C.length) return empty('Fills in as students finish the survey.');
  const W = 520, H = 330, ml = 52, mr = 20, mt = 20, mb = 48, pw = W - ml - mr, ph = H - mt - mb;
  const pts = C.map(c => { const ts = c.teams.filter(t => t.sat != null); return {c, x:mean(ts.map(t => t.sat)), y:mean(c.teams.map(t => t.frac)), h:mean(ts.map(t => t.felt_heard)), n:c.teams.length}; });
  const xmin = 1, xmax = 5, ymin = Math.max(0, Math.min(0.4, Math.floor((Math.min(...pts.map(p => p.y)) - .1) * 10) / 10)), ymax = 1;
  const X = v => ml + (v - xmin) / (xmax - xmin) * pw, Y = v => mt + ph - (v - ymin) / (ymax - ymin) * ph;
  let g = '';
  [1, 2, 3, 4, 5].forEach(v => { g += L(X(v), mt, X(v), mt + ph, {c:GRID}) + T(X(v), H - mb + 18, v, {anchor:'middle', size:11}); });
  yTicks(ymin, ymax, Math.round((ymax - ymin) / .1)).forEach(v => { g += L(ml, Y(v), ml + pw, Y(v), {c:GRID}) + T(ml - 7, Y(v) + 4, v.toFixed(1), {anchor:'end', size:11}); });
  g += T(ml + pw, mt + ph - 8, 'liked it more →', {anchor:'end', size:11, fill:MUT}) + T(ml + 8, mt + 12, '↑ better design', {size:11, fill:MUT});
  pts.forEach(p => {
    p.r = 7 + Math.sqrt(p.n) * 2.2;
    g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r}" fill="${p.c.color}" fill-opacity=".78" stroke="#fff" stroke-width="2"><title>${p.c.label}: satisfaction ${p.x.toFixed(1)}/5, ${pct(p.h)} felt heard, quality ${p.y.toFixed(2)}</title></circle>`;
  });
  const lab = [...pts].sort((a, b) => Y(a.y) - Y(b.y)); let lastY = mt + 26;
  lab.forEach(p => {
    const ly = Math.max(lastY, Y(p.y) - 4); lastY = ly + 16;
    const right = X(p.x) < ml + pw * 0.55, lx = right ? Math.min(ml + pw - 4, X(p.x) + 70) : Math.max(ml + 4, X(p.x) - 70);
    g += L(X(p.x) + (right ? p.r : -p.r), Y(p.y), lx + (right ? -3 : 3), ly - 4, {c:p.c.color});
    g += T(lx, ly, `${p.c.label} · ${p.x.toFixed(1)}/5 · ${pct(p.h)} heard`, {anchor:right ? 'start' : 'end', size:11.5, weight:700, fill:p.c.color});
  });
  g += T(ml + pw / 2, H - 12, 'satisfaction with the discussion (1–5)', {anchor:'middle', size:12});
  g += T(14, mt + ph / 2, 'fraction of optimal value', {rot:-90, anchor:'middle', size:11.5});
  return svg(W, H, g, 'Satisfaction versus design quality');
}

/* ---------- Horizontal 100% bars (progress, ratings) ---------- */
function stackRows(rows, segs, W){
  W = W || 560;
  const ml = 120, mr = 50, rowH = 34, H = rows.length * rowH + 8, pw = W - ml - mr;
  let g = '';
  rows.forEach((r, i) => {
    const tot = segs.reduce((a, [k]) => a + (r.v[k] || 0), 0), y = 4 + i * rowH, h = rowH - 12;
    g += T(ml - 10, y + h / 2 + 5, r.label, {anchor:'end', size:12.5, fill:INK, weight:700});
    if (!tot){ g += `<rect x="${ml}" y="${y}" width="${pw}" height="${h}" rx="4" fill="${GRID}"/>`; g += T(ml + 8, y + h / 2 + 4, 'nothing yet', {size:11}); return; }
    let x = 0;
    segs.forEach(([k, l, col]) => {
      const v = r.v[k] || 0; if (!v) return;
      const w = v / tot * pw;
      g += `<rect x="${ml + x}" y="${y}" width="${w}" height="${h}" fill="${col}"><title>${r.label} · ${l}: ${v} (${pct(v / tot)})</title></rect>`;
      if (w > 26) g += T(ml + x + w / 2, y + h / 2 + 4, v, {anchor:'middle', size:11, fill:'#fff', weight:700});
      x += w;
    });
    g += T(ml + pw + 8, y + h / 2 + 4, tot, {size:11.5});
  });
  return svg(W, H, g, 'stacked bars') + legend(segs.map(([k, l, col]) => [col, l]));
}

/* ---------- Small multiples: messages ---------- */
function messages(D){
  const C = D.conds.filter(c => c.msgs.count);
  if (!C.length) return empty('Fills in as students send messages.');
  const M = [['per_person','Messages per person', v => v.toFixed(1)], ['words','Words per message', v => v.toFixed(0)], ['secs','Seconds spent writing', v => v.toFixed(0)]];
  const W = 1100, H = 210, gap = 40, pw = (W - gap * 2) / 3;
  let g = '';
  M.forEach(([k, l, fmt], j) => {
    const x0 = j * (pw + gap), vals = C.map(c => c.msgs[k] || 0), mx = Math.max(...vals, 1e-9);
    g += T(x0, 14, l, {size:12.5, weight:700, fill:INK});
    C.forEach((c, i) => {
      const y = 28 + i * 40, w = (pw - 110) * (c.msgs[k] || 0) / mx;
      g += T(x0, y + 15, c.label, {size:11.5});
      g += `<rect x="${x0 + 104}" y="${y + 2}" width="${Math.max(2, w)}" height="18" rx="3" fill="${c.color}"/>`;
      g += T(x0 + 108 + w, y + 16, fmt(c.msgs[k] || 0), {size:11.5, fill:INK, weight:700});
    });
  });
  return svg(W, Math.max(H, 40 + C.length * 40), g, 'Message statistics');
}

/* ---------- KPI callouts and insight boxes (like the slide's right column) ---------- */
function kpis(D){
  const C = D.conds.filter(c => c.teams.length), all = C.flatMap(c => c.teams);
  const tiles = [];
  tiles.push([`${D.totals.finished}<small> / ${D.totals.teams}</small>`, '#255E4B', 'teams finished', `${D.totals.done_students} of ${D.totals.students} students are done`]);
  if (all.length){
    const un = C.find(c => c.key === 'unmediated'), best = [...C].sort((a, b) => mean(b.teams.map(t => t.frac)) - mean(a.teams.map(t => t.frac)))[0];
    const mb = mean(best.teams.map(t => t.frac));
    if (un && best.key !== 'unmediated'){ const d = mb - mean(un.teams.map(t => t.frac)); tiles.push([`${d >= 0 ? '+' : ''}${d.toFixed(2)}`, best.color, `more of the available value with ${best.label} than with no mediator`, `${best.label} averages ${mb.toFixed(2)} of the best design`]); }
    else tiles.push([mb.toFixed(2), best.color, `of the best design for ${best.label}, the top type so far`, '']);
    const beat = all.filter(t => t.frac > D.single_frac + 1e-9).length / all.length;
    tiles.push([pct(beat), '#44AA99', 'of teams beat the best design any one engineer could do alone', `best single engineer = ${D.single_frac.toFixed(2)}`]);
    const fh = all.filter(t => t.felt_heard != null);
    if (fh.length) tiles.push([pct(mean(fh.map(t => t.felt_heard))), '#117733', 'of students felt heard (4 or 5 out of 5)', '']);
    const worse = all.filter(t => t.frac < D.naive_frac - 1e-9).length;
    tiles.push([worse, worse ? '#CC6677' : '#5b6070', `team${worse === 1 ? '' : 's'} did worse than never talking at all`, `never-talked team = ${D.naive_frac.toFixed(2)}`]);
  }
  return `<div class="ch-kpis">${tiles.map(([v, c, l, s]) => `<div class="ch-kpi"><b style="color:${c}">${v}</b><span>${E(l)}</span>${s ? `<em>${E(s)}</em>` : ''}</div>`).join('')}</div>`;
}
function insights(D){
  const C = D.conds.filter(c => c.teams.length);
  if (C.length < 2) return '';
  const act = c => c.teams.reduce((a, t) => a + t.steps.actioned, 0) / (c.teams.reduce((a, t) => a + t.facts, 0) || 1);
  const byAct = [...C].sort((a, b) => act(b) - act(a)), hi = byAct[0], lo = byAct[byAct.length - 1];
  const S = C.filter(c => c.teams.some(t => t.sat != null));
  const sat = c => mean(c.teams.filter(t => t.sat != null).map(t => t.sat));
  const q = c => mean(c.teams.map(t => t.frac));
  let b2 = '';
  if (S.length >= 2){
    const happy = [...S].sort((a, b) => sat(b) - sat(a))[0], good = [...S].sort((a, b) => q(b) - q(a))[0];
    b2 = happy.key === good.key
      ? `<b style="color:${happy.color}">${E(happy.label)}</b> is both the best liked (${sat(happy).toFixed(1)}/5) and the best scoring (${q(happy).toFixed(2)}) so far.`
      : `<b style="color:${happy.color}">${E(happy.label)}</b> is the best liked (${sat(happy).toFixed(1)}/5) but scores ${q(happy).toFixed(2)}. <b style="color:${good.color}">${E(good.label)}</b> scores best (${q(good).toFixed(2)}) with ${sat(good).toFixed(1)}/5 satisfaction.`;
  }
  return `<div class="ch-ins"><div class="ch-box"><h4 style="color:${hi.color}">Where the hidden findings got through</h4>
      <p><b style="color:${hi.color}">${E(hi.label)}</b> teams carried ${pct(act(hi))} of their hidden findings all the way into the final design, against ${pct(act(lo))} for <b style="color:${lo.color}">${E(lo.label)}</b>.</p></div>
    ${b2 ? `<div class="ch-box dark"><h4>Liked it vs. got it right</h4><p>${b2}</p></div>` : ''}</div>`;
}

window.renderCharts = function(D, ti){
  ti = ti || (() => '');
  const t = new Date(D.updated || Date.now());
  const stamp = t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'});
  const finished = D.conds.reduce((a, c) => a + c.teams.length, 0);
  const progSegs = [['card','Reading brief','#9aa0ad'], ['writing','Writing','#44AA99'], ['waiting','Waiting','#e2a33b'], ['final','Deciding','#332288'], ['survey','Survey','#5b6070'], ['done','Done','#117733']];
  const rateSegs = [['Agree','Agree','#117733'], ['Partly','Partly','#e2a33b'], ['Disagree','Disagree','#CC6677']];
  const med = D.conds.filter(c => c.key !== 'unmediated');
  window.__CH_D = D;
  return `<div class="ch-root"><div class="ch-tools"><div class="ch-live" style="margin:0">${(typeof S !== 'undefined' && S.archive) ? 'Saved copy · ' : `<span class="ch-dot"></span>Live · updated ${E(stamp)} · `}${finished} finished team${finished === 1 ? '' : 's'} counted${D.consent_only ? ' · consenting teams only' : ''}</div>
    <span class="ch-tbtns"><button type="button" class="ch-report xp-btn" data-preset=""><i class="ic ic-download"></i>Build a report</button><button type="button" class="ch-report xp-btn ghost" data-preset="slides">Slide deck</button><button type="button" class="ch-report xp-btn ghost" data-preset="images">Images</button></span></div>
  ${kpis(D)}
  ${insights(D)}
  <div class="ch-grid">
    ${card('Which deliberation approach yields the best designs?', 'Each dot is one team. Thick line = average. Higher is better.', rq1(D), {key:'rq1', kicker:'RQ1', wide:1, tip:ti('ch_rq1')})}
    ${card('How much private information reached the final design?', 'Pooling index with 95% confidence intervals.', rq2(D), {key:'rq2', kicker:'RQ2', tip:ti('ch_rq2')})}
    ${card('Hidden features funded, and how many "worth less" ones slipped in', 'Bars: share of each discipline\'s hidden "worth more" features in the final set. Dashed line: "worth less" features funded.', rq3(D), {key:'rq3', kicker:'RQ3', tip:ti('ch_rq3')})}
    ${card('Where findings get lost: the four steps', 'Share of all hidden findings still alive at each step.', steps(D), {key:'steps', kicker:'Four steps', tip:ti('ch_steps')})}
    ${card('Liked it vs. got it right', 'Each bubble is a deliberation type. Bigger bubble = more teams.', satisfaction(D), {key:'sat', kicker:'Experience', tip:ti('ch_sat')})}
    ${card('Points lost at each step (average team)', 'From 0 to the best possible 448 points. The colored part is what the team kept.', pointsLost(D), {key:'points', kicker:'Points', wide:1, tip:ti('ch_points')})}
    ${card('Where everyone is right now', 'Every student in an analyzed team, by step. Updates live.', stackRows(D.conds.map(c => ({label:c.label, v:c.progress})), progSegs), {key:'progress', kicker:'Live', tip:ti('ch_progress')})}
    ${card('How students rated the Mediator\'s cards', 'Private ratings on Mediator drafts and recaps.', med.length ? stackRows(med.map(c => ({label:c.label, v:c.ratings})), rateSegs) : empty('No Mediator types in this session.'), {key:'ratings', kicker:'Mediator', tip:ti('ch_ratings')})}
    ${card('How much people wrote', 'Real students only; simulated students are left out of writing time.', messages(D), {key:'msgs', kicker:'Messages', wide:1, tip:ti('ch_msgs')})}
  </div></div>`;
};
})();

/* Chart and report export for the admin Charts tab.
   - Every chart card gets a Download menu (PNG, JPG, SVG, PDF, CSV).
   - "Build a report" opens a builder: pick and order the items, page size, layout, title and format.
   Everything is made in the browser from the charts' own SVG. No libraries.
   Formats: PDF, PowerPoint (.pptx), Word (.docx), PNG, JPG, SVG, HTML, CSV, and a zip of everything. */
'use strict';
(function(){
const GREEN = '#255E4B', INK = '#1f232b', MUT = '#5b6070', LINE = '#e6e8ef', DARK = '#2A2E3B';
const SANS = "Carlito, Calibri, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif", SERIF = "'Source Serif 4', Cambria, Georgia, 'Times New Roman', serif";
const X = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s || 'chart').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'chart';
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

/* ---------------- text measuring and wrapping ---------------- */
const MC = document.createElement('canvas').getContext('2d');
function tw(text, size, bold, serif){ MC.font = `${bold ? '700 ' : ''}${size}px ${serif ? SERIF : SANS}`; return MC.measureText(text).width; }
function wrap(text, maxW, size, bold, serif){
  const words = String(text || '').replace(/\s+/g, ' ').trim().split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (cur && tw(t, size, bold, serif) > maxW){ lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}
const txt = (x, y, s, o) => `<text x="${x}" y="${y}" font-family="${o.serif ? SERIF : SANS}" font-size="${o.size}" font-weight="${o.bold ? 700 : 400}" fill="${o.fill || INK}"${o.anchor ? ` text-anchor="${o.anchor}"` : ''}${o.ls ? ` letter-spacing="${o.ls}"` : ''}>${X(s)}</text>`;

/* ---------------- read the live Charts tab ---------------- */
const root = () => document.querySelector('.ch-root');
function items(){
  const R = root(); if (!R) return [];
  const out = [];
  if (R.querySelector('.ch-kpis')) out.push({key:'kpis', title:'Summary numbers', kind:'kpis'});
  if (R.querySelector('.ch-ins')) out.push({key:'insights', title:'Key insights', kind:'insights'});
  R.querySelectorAll('.ch-card[data-key]').forEach(el => out.push({key:el.dataset.key, title:el.dataset.title, kind:'chart', wide:el.classList.contains('wide')}));
  return out;
}

/* Each item becomes one self-contained SVG block, BW units wide. Returns {w, h, body} */
const BW = 1000, PAD = 30;
function blockChart(el){
  const title = el.dataset.title, sub = el.dataset.sub, kicker = el.dataset.kicker;
  let y = PAD, g = '';
  if (kicker){ g += txt(PAD, y + 12, kicker.toUpperCase(), {size:13, bold:1, fill:GREEN, ls:1}); y += 24; }
  wrap(title, BW - 2 * PAD, 24, 1, 1).forEach(l => { g += txt(PAD, y + 22, l, {size:24, bold:1, serif:1}); y += 30; });
  if (sub){ y += 2; wrap(sub, BW - 2 * PAD, 15).forEach(l => { g += txt(PAD, y + 15, l, {size:15, fill:MUT}); y += 21; }); }
  y += 12;

function layout(o){
  const D = window.__CH_D || {};
  const blocks = o.keys.map(k => { const b = block(k); return b ? withNote(b, k, D, o.explain) : null; }).filter(Boolean);
  if (o.appendix) blocks.push(...appendixBlocks(D));
  if (o.layout === 'long'){
    const W = 1400, M = 60, head = o.header ? headerSVG(o, W) : {g:'', h:30};
    let y = head.h + 10, g = head.g;
    blocks.forEach(b => { const s = (W - 2 * M) / b.w; g += place(b, M, y, W - 2 * M, b.h * s); y += b.h * s + 28; });
    y += 70; g += footerSVG({...o, pageNums:false}, W, y, 1, 1);
    return [{w:W, h:y, svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${y}" viewBox="0 0 ${W} ${y}"><rect width="100%" height="100%" fill="#EFF1F5"/>${g}</svg>`}];
  }
  const P = PAGES[o.page] || PAGES.letter, W = P.w, H = P.h, M = 80, top = 50, bot = 80, gap = 26;
  const pages = []; let cur = null;
  const newPage = first => { const head = first && o.header ? headerSVG(o, W) : {g:`<rect x="0" y="0" width="${W}" height="10" fill="${GREEN}"/>`, h:top}; cur = {g:head.g, y:head.h + 10, y0:head.h + 10, n:0}; pages.push(cur); };
  newPage(true);
  const areaW = W - 2 * M, bottom = () => H - bot - 10;
  if (o.layout === 'flow'){
    blocks.forEach(b => {
      let s = areaW / b.w, h = b.h * s;
      const full = bottom() - (top + 10);
      if (h > full){ s = full / b.h; h = full; }
      if (cur.y + h > bottom() && cur.n) newPage(false);
      if (cur.y + h > bottom()){ s = (bottom() - cur.y) / b.h; h = b.h * s; }
      cur.g += place(b, M, cur.y, areaW, h); cur.y += h + gap; cur.n++;
    });
  } else {
    const per = o.layout === 'one' ? 1 : o.layout === 'two' ? 2 : 4;
    blocks.forEach((b, i) => {
      if (i && i % per === 0) newPage(false);
      const k = i % per, y0 = cur.y0, availH = bottom() - y0;
      if (per === 4){
        const cw = (areaW - gap) / 2, ch = (availH - gap) / 2, cx = M + (k % 2) * (cw + gap), cy = y0 + Math.floor(k / 2) * (ch + gap);
        cur.g += place(b, cx, cy, cw, ch);
      } else {
        const ch = (availH - gap * (per - 1)) / per;
        cur.g += place(b, M, y0 + k * (ch + gap), areaW, ch);
      }
      cur.n++;
    });
  }
  const N = pages.length;
  return pages.map((p, i) => ({w:W, h:H, svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#ffffff"/>${p.g}${footerSVG(o, W, H, i + 1, N)}</svg>`}));
}

/* ---------------- raster + file writers ---------------- */
function svgToCanvas(svg, w, h, scale){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c); };
    img.onerror = () => rej(new Error('Could not draw the chart'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
const blobBytes = async b => new Uint8Array(await b.arrayBuffer());
const enc = new TextEncoder();
const u8 = s => typeof s === 'string' ? enc.encode(s) : s;
function concat(parts){ const n = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(n); let o = 0; parts.forEach(p => { out.set(p, o); o += p.length; }); return out; }

/* PDF: one JPEG per page, sized to the page in points */
function makePDF(pages){
  const parts = [], offs = []; let pos = 0;
  const add = d => { d = u8(d); parts.push(d); pos += d.length; };
  const obj = (n, body) => { offs[n] = pos; add(`${n} 0 obj\n`); body.forEach(add); add('\nendobj\n'); };
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N = pages.length, kids = pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
  obj(1, ['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2, [`<< /Type /Pages /Kids [${kids}] /Count ${N} >>`]);
  pages.forEach((p, i) => {
    const pn = 3 + i * 3, cn = pn + 1, im = pn + 2, [W, H] = p.pt;
    obj(pn, [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${cn} 0 R >>`]);
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(cn, [`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
    obj(im, [`<< /Type /XObject /Subtype /Image /Width ${p.px[0]} /Height ${p.px[1]} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`, p.jpg, '\nendstream']);
  });
  const xref = pos, total = 3 + N * 3;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob([concat(parts)], {type:'application/pdf'});
}

/* ZIP (stored, no compression) */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files, type){
  const local = [], central = []; let off = 0;
  const le = (n, b) => { const a = new Uint8Array(b); for (let i = 0; i < b; i++) a[i] = (n >>> (8 * i)) & 255; return a; };
  files.forEach(f => {
    const name = enc.encode(f.name), data = u8(f.data), crc = crc32(data);
    const head = concat([le(0x04034b50, 4), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(crc, 4), le(data.length, 4), le(data.length, 4), le(name.length, 2), le(0, 2), name]);
    local.push(head, data);
    central.push(concat([le(0x02014b50, 4), le(20, 2), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(crc, 4), le(data.length, 4), le(data.length, 4), le(name.length, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 4), le(off, 4), name]));
    off += head.length + data.length;
  });
  const cd = concat(central);
  return new Blob([...local, cd, concat([le(0x06054b50, 4), le(0, 2), le(0, 2), le(files.length, 2), le(files.length, 2), le(cd.length, 4), le(off, 4), le(0, 2)])], {type:type || 'application/zip'});
}

  ];
  imgs.forEach((png, i) => files.push({name:`word/media/page${i + 1}.png`, data:png}));

/* ---------------- CSV data behind each chart ---------------- */
const csvCell = v => { v = v == null ? '' : typeof v === 'number' ? String(Math.round(v * 1000) / 1000) : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
const avg = a => { a = a.filter(x => x != null && !isNaN(x)); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const TEAMCOLS = {
  rq1:['frac'], rq2:['pooling'], rq3:['gems.ME', 'gems.MF', 'gems.HF', 'decoys'], steps:['facts', 'steps.spoken', 'steps.heard', 'steps.integrated', 'steps.actioned'],
  sat:['sat', 'felt_heard', 'frac'], points:['pts', 'lost.ns', 'lost.nh', 'lost.ni', 'lost.wrong', 'lost.other'],
};
const get = (o, path) => path.split('.').reduce((a, k) => a == null ? a : a[k], o);
function csvFor(key){
  const D = window.__CH_D; if (!D) return 'no data\n';
  const C = D.conds || [];
  if (TEAMCOLS[key]){
    const cols = TEAMCOLS[key], rows = [['section', 'type', 'team', 'n_teams', ...cols]];
    C.forEach(c => rows.push(['by type', c.label, '', c.teams.length, ...cols.map(k => avg(c.teams.map(t => get(t, k))))]));
    C.forEach(c => c.teams.forEach(t => rows.push(['by team', c.label, t.id, 1, ...cols.map(k => get(t, k))])));
    return toCSV(rows);
  }
  const flat = (field) => { const ks = [...new Set(C.flatMap(c => Object.keys(c[field] || {})))]; return toCSV([['type', ...ks], ...C.map(c => [c.label, ...ks.map(k => (c[field] || {})[k] ?? 0)])]); };
  if (key === 'progress') return flat('progress');
  if (key === 'ratings') return flat('ratings');
  if (key === 'msgs') return flat('msgs');
  if (key === 'kpis') return toCSV([['value', 'label', 'note'], ...[...root().querySelectorAll('.ch-kpi')].map(t => [(t.querySelector('b') || {}).textContent, (t.querySelector('span') || {}).textContent, (t.querySelector('em') || {}).textContent])]);
  if (key === 'insights') return toCSV([['heading', 'text'], ...[...root().querySelectorAll('.ch-box')].map(b => [(b.querySelector('h4') || {}).textContent, (b.querySelector('p') || {}).textContent])]);
  return 'no data\n';
}

/* ---------------- saving (with a fallback for phones and embedded views) ---------------- */
let DL = null, dlTried = false;
async function viewerDownloads(){
  if (dlTried) return DL; dlTried = true;
  try { if (window.claude && typeof window.claude.use === 'function') DL = await window.claude.use('downloads'); } catch (_){ DL = null; }
  return DL;
}
async function save(blob, name){
  const dl = await viewerDownloads();
  if (dl){
    try { await dl.save({filename:name, data:blob}); return; }
    catch (err){
      const code = err && err.code;
      if (code === 'declined') return toast('Download cancelled.');
      if (code === 'rate_limited') return toast('One download at a time. Try again in a moment.');
      if (code === 'rejected_extension' || code === 'extension_not_enabled') return toast('That file type cannot be saved here. Try PDF or PNG.');
      if (code === 'too_large') return toast('That file is too big to save here. Try fewer items or PNG instead.');
      /* unavailable or anything else: fall back to a normal browser download below */
    }
  }
  plainSave(blob, name);
}
function toast(msg){
  let el = document.getElementById('xp-note');
  if (!el){ el = document.createElement('div'); el.id = 'xp-note'; document.body.appendChild(el); }
  el.className = 'xp-note show'; el.innerHTML = `<span>${X(msg)}</span><button type="button" class="xp-x" aria-label="Close">×</button>`;
  el.querySelector('.xp-x').onclick = () => el.classList.remove('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 5000);
}
function plainSave(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  note(name, url, blob.type);
}
function note(name, url, type){
  let el = document.getElementById('xp-note');
  if (!el){ el = document.createElement('div'); el.id = 'xp-note'; document.body.appendChild(el); }
  el.className = 'xp-note show';

/* ---------- Live team timelines (admin Live tab) ---------- */
(function(){
  const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rnd = st => +((st || '').match(/\d+/) || [0])[0];
  const mmss = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function segments(rounds, tm){
    tm = Object.assign({card:5, round1:6, round:5, final:1, survey:4}, tm || {});
    const s = [{k:'brief', l:'Read brief', m:tm.card, t:'g'}];
    for (let n = 1; n <= rounds; n++){ s.push({k:'r' + n, l:'Round ' + n, m:n === 1 ? tm.round1 : tm.round, t:'s'}); s.push({k:'m' + n, l:'Mediator', m:1, t:'m'}); }
    s.push({k:'decide', l:'Decide', m:tm.final, t:'g'}, {k:'survey', l:'Survey', m:tm.survey, t:'g'});
    return s;
  }
  /* Which block a team is in, and how full it is (share of members past it). */
  function stage(t, S){
    const st = t.steps, n = st.length || 1, at = k => S.findIndex(x => x.k === k);
    if (st.every(s => s === 'done')) return {idx:S.length, frac:1};
    if (st.some(s => s === 'card')) return {idx:0, frac:st.filter(s => s !== 'card').length / n};
    if (!st.some(s => /^(post|wait)/.test(s))){
      if (st.some(s => s === 'final')) return {idx:at('decide'), frac:st.filter(s => s !== 'final').length / n};
      return {idx:at('survey'), frac:st.filter(s => s === 'done').length / n};
    }
    const r = Math.max(...st.map(rnd)), waiting = st.filter(s => s === 'wait' + r).length;
    if (waiting === n) return {idx:at('m' + r), frac:t.pending ? 0.5 : 1};
    return {idx:at('r' + r), frac:waiting / n};
  }
  window.renderTimelines = function(teams, rounds, opt){
    opt = opt || {};
    const ti = opt.ti || (() => ''), S = segments(rounds, opt.timers), total = S.reduce((a, s) => a + s.m, 0);
    const cum = []; S.reduce((a, s, i) => (cum[i] = a, a + s.m), 0);
    const head = `<div class="tl-row tl-head"><div></div><div class="tl-bar">${S.map(s => `<div class="tl-lab" style="flex:${s.m}">${s.t === 'm' ? 'M' : E(s.l)}</div>`).join('')}</div><div class="tl-side">Time · pace</div></div>`;
    const parts = {};
    const rows = teams.map(t => {
      const g = stage(t, S), done = g.idx >= S.length, med = t.mediated !== false;
      const actual = done ? total : cum[g.idx] + g.frac * S[g.idx].m, el = t.elapsed / 60, diff = el - actual;
      let pace = ['On pace', 'ok'];
      if (done) pace = ['Done', 'ok']; else if (el < 0.3) pace = ['Starting', 'gray'];
      else if (diff > 4) pace = [`${Math.round(diff)} min behind`, 'bad']; else if (diff > 1.5) pace = [`${Math.round(diff)} min behind`, 'warn'];
      else if (diff < -1.5) pace = ['Ahead', 'blue'];
      const bar = S.map((s, i) => {
        const f = i < g.idx ? 100 : i === g.idx ? Math.round(g.frac * 100) : 0;
        const cls = `tl-seg tl-${s.t}${s.t === 'm' && !med ? ' tl-none' : ''}${i === g.idx && !done ? ' cur' : ''}`;
        const tip = s.t === 'm' && !med ? 'Messages revealed (no Mediator)' : s.l;
        return `<div class="${cls}" style="flex:${s.m}" title="${E(tip)}${i === g.idx && !done ? ` · ${f}% of the team past it` : ''}"><i style="width:${f}%"></i></div>`;
      }).join('');
      const now = done ? '' : `<b class="tl-now" style="left:calc(${Math.min(el / total, 1) * 100}% - 1px)" title="Where the suggested schedule says they should be"></b>`;
      const flags = (t.spare ? ' <span class="st warn">Spare</span>' : '') + (t.nonconsent ? ' <span class="st gray">No consent</span>' : '');
      parts[t.id] = {bar:`<div class="tl-bar">${bar}${now}</div>`, side:`<div class="tl-side"><b>${mmss(t.elapsed)}</b> <span class="st ${pace[1]}">${pace[0]}</span></div>`, diff:done ? -999 : diff};
      return `<div class="tl-row"><div class="tl-name"><a href="#" data-act="${opt.logAct || 'admteam'}" data-team="${t.id}"><b>Team ${t.id}</b></a>${flags}<span>${E(opt.hideCond ? 'type hidden' : t.label)}</span></div>
        <div class="tl-bar">${bar}${now}</div>
        <div class="tl-side"><b>${mmss(t.elapsed)}</b> <span class="st ${pace[1]}">${pace[0]}</span></div></div>`;
    }).join('');
    if (opt.parts) return {parts, total, head:`<div class="tl-bar">${S.map(s => `<div class="tl-lab" style="flex:${s.m}">${s.t === 'm' ? 'M' : E(s.l)}</div>`).join('')}</div>`,
      legend:'<span class="ch-legend"><span><i style="background:#9aa0ad"></i>Same for all</span><span><i style="background:#44AA99"></i>Students writing</span><span><i style="background:#2A2E3B"></i>Mediator writing</span><span><i style="background:#CC6677;width:3px"></i>Suggested pace</span></span>'};
    return `<div class="card"><div class="inline" style="justify-content:space-between"><h3 style="margin:0">Team timelines${ti('timelines')}</h3>
      <span class="ch-legend" style="margin:0"><span><i style="background:#9aa0ad"></i>Same for all</span><span><i style="background:#44AA99"></i>Students writing</span><span><i style="background:#2A2E3B"></i>Mediator writing</span><span><i style="background:#CC6677;width:3px"></i>Suggested pace</span></span></div>
      <p class="small muted">Block widths follow the ${total}-minute schedule from the step timers in Setup. The current block fills as teammates finish it. Players see a countdown for each step and get reminders at 1 minute left and at time's up. Nobody is cut off.</p>

})();

const mmssT = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
/* left = seconds left (negative = over time) */

function timerHTML(g, left, paused, waitingText){
  if (!g) return waitingText ? `<div id="stimer" class="stimer wait"><div class="st-row"><span class="st-ico">✓</span><span class="st-lab">${waitingText}</span></div></div>` : '<div id="stimer"></div>';
  if (paused) return `<div id="stimer" class="stimer paused"><div class="st-row"><span class="st-ico"><i class="ic ic-pause"></i></span><span class="st-lab">${g.what}</span><b class="st-left">Paused</b></div><div class="st-bar"><i style="width:${Math.max(0, Math.min(100, left / (g.m * 60) * 100))}%"></i></div></div>`;
  const lv = timerLevel(left, g), pct = Math.max(0, Math.min(100, left / (g.m * 60) * 100));
  const right = lv === 'over' ? `Time's up${left < -5 ? ` · +${mmssT(-left)}` : ''}` : `${mmssT(left)} left`;
  const sub = lv === 'over' ? `Please ${g.send} now.` : lv === 'warn' ? `Almost out of time. Finish up and ${g.send}.` : `Suggested time: ${g.m} min`;
  return `<div id="stimer" class="stimer ${lv}" role="timer" aria-live="${lv === 'ok' ? 'off' : 'assertive'}">
    <div class="st-row"><span class="st-ico">${lv === 'over' ? '<i class="ic ic-bell"></i>' : '<i class="ic ic-clock"></i>'}</span><span class="st-lab">${g.what}</span><b class="st-left">${right}</b></div>

/* Called every second. ctx = {g, start(ms), paused, waitingText, stepKey, onWarn(level)} */
const TIMER_SEEN = {};
function tickTimer(ctx){
  const el = document.getElementById('stimer'); if (!el) return;
  if (!ctx || !ctx.g){ const html = timerHTML(null, 0, false, ctx && ctx.waitingText); if (el.outerHTML !== html) el.outerHTML = html; return; }
  const left = ctx.g.m * 60 - (ctx.now - ctx.start) / 1000;

    case 'sim': allTeams().forEach(T => activeRoles(T).forEach(k => { if (S.seats[T.roles[k].seat].bot && !T.pending && Math.random() < 0.75) botAct(T, k); })); return render();
    case 'savesetup': {
      S.settings.classCode = (document.getElementById('ccode').value || 'SD26').trim().toUpperCase();
      S.settings.rounds = Math.max(1, Math.min(4, parseInt(document.getElementById('rounds').value, 10) || 2));
      S.settings.threshold = Math.max(0, parseInt(document.getElementById('thresh').value, 10) || 0);
      return flash('Saved.');
    }
    case 'reset': S = freshState(); S.view = 'admin'; return render();
    case 'copyres': return copyText(toCSV(analysedTeams().map(teamResult).filter(Boolean)), 'Results');
    case 'copyfacts': return copyText(toCSV(allTeams().filter(T => T.final && (!S.consentOnly || !T.nonconsent)).flatMap(factFunnel)), 'Facts');
    case 'copymsgs': return copyText(toCSV(messageRows()), 'Messages');
    case 'copypeople': return copyText(toCSV(Object.values(S.seats).filter(s => !S.consentOnly || s.consent).map(s => { const T = s.team != null ? S.teams[s.team] : null; const R = T && T.roles[s.role];
      return {session:S.sessionId, pid:s.pid, consent:s.consent == null ? '' : +s.consent, team:s.team ?? '', role:s.role || '', pseudonym:R ? R.pseudo : '', condition:T ? T.cond : '', spare:T ? +!!T.spare : '', late:T ? +!!T.late : +s.late,
        brief_check_role:R ? +(R.chk.role === s.role) : '', brief_check_privacy:R ? +(R.chk.see === 'no') : '', accepted:R && R.endorse != null ? +R.endorse : '', finished:R ? +(R.step === 'done') : 0}; })), 'Participants');
    case 'copyevents': return copyText(toCSV(eventRows(S.events.filter(ev => !S.consentOnly || (S.seats[seatIdByPid(ev.pid)] || {}).consent))), 'All events');
    case 'copyperson': return copyText(toCSV(eventRows(S.events.filter(ev => ev.pid === S.personPid))), S.personPid + ' events');
    case 'person': S.personPid = b.dataset.pid; S.adminTab = 'people'; S.adminTeam = null; render(); return window.scrollTo(0,0);
    case 'peopleback': S.personPid = null; return render();
    case 'fpause': S.fpause = !S.fpause; if (!S.fpause) S.feedShown = null; return render();
    case 'copyall': return copyText(JSON.stringify(exportData(), null, 2), 'All data');
    case 'hidecopy': S.showCopy = null; return render();
  }
  if (!c) return;
  const {T, r, R} = c;
  switch (act){
    case 'fill': activeRoles(T).filter(k => k !== r && S.seats[T.roles[k].seat].bot).forEach(k => { if (!T.pending) botAct(T, k); }); return render();
    case 'chk': R.chk[b.dataset.k] = b.dataset.v; track(c.seat, 'answer', {block:'brief_check', item:b.dataset.k, value:b.dataset.v, correct:b.dataset.k === 'role' ? b.dataset.v === r : b.dataset.v === 'no'});
      if (R.chk.role && R.chk.see) logEv(T, {round:0, who:r, kind:'check', text:`Brief check: role ${R.chk.role === r ? 'correct' : 'wrong'}, privacy ${R.chk.see === 'no' ? 'correct' : 'wrong'}`, set:null});
      return render();
    case 'lik': (b.dataset.g === 'pre' ? R.pre : R.sv)[b.dataset.k] = +b.dataset.v; track(c.seat, 'answer', {block:b.dataset.g === 'pre' ? 'pre_survey' : 'post_survey', item:b.dataset.k, value:+b.dataset.v}); return render();
    case 'leak': R.sv.leak = b.dataset.v; track(c.seat, 'answer', {block:'post_survey', item:'leak', value:b.dataset.v}); return render();
    case 'ready': logEv(T, {round:0, who:r, kind:'pre', answers:{...R.pre}, text:'Pre-survey', set:null}); ready(T, r); render(); return window.scrollTo(0,0);
    case 'insfact': { const tag = `[${b.dataset.fact}] `; R.text = (R.text && !R.text.endsWith(' ') ? R.text + ' ' : R.text) + tag; R.tapped.push(b.dataset.fact); track(c.seat, 'insert_fact', {fact:b.dataset.fact});
      S.tab = 'chat'; render(); const el = document.getElementById('composer'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    case 'send': clearTimeout(snapTimers[c.seat.pid + 'message']); track(c.seat, 'send_click', {chars:R.text.trim().length}); submitPost(T, r, +b.dataset.n, R.text.trim(), R.picks); render(); return window.scrollTo(0,0);
    case 'rate': rateCard(T, r, b.dataset.mid, b.dataset.v); return render();
    case 'endorse': endorse(T, r, b.dataset.yes === '1', R.comment.trim()); render(); return window.scrollTo(0,0);
    case 'survey': submitSurvey(T, r); render(); return window.scrollTo(0,0);
  }
});
document.addEventListener('change', e => {
  const t = e.target, c = cur();
  if (t.dataset.act === 'seatsel'){ if (S.seats[t.value]) goSeat(t.value); return; }
  if (t.dataset.act === 'cond'){ const L = S.settings[t.dataset.list]; S.settings[t.dataset.list] = t.checked ? [...new Set([...L, t.value])] : L.filter(x => x !== t.value); return render(); }
  if (t.dataset.act === 'consentonly'){ S.consentOnly = t.checked; return render(); }
  if (t.id === 'wf-pick'){ if (t.value) wGo(t.value); return; }
  if (t.id === 'wf-cond' || t.id === 'wf-kind' || t.id === 'wf-team'){ S.wf[t.id.slice(3)] = t.value; return render(); }
  if (t.id === 'fteam'){ S.fteam = t.value; return render(); }
  if (t.id === 'fnobots'){ S.fnobots = t.checked; return render(); }
  if (t.classList.contains('fkind')){ S.fkinds = t.checked ? [...new Set([...S.fkinds, t.value])] : S.fkinds.filter(x => x !== t.value); return render(); }
  if (!c) return;
  if (t.dataset.act === 'pick'){ const id = t.dataset.id; c.R.picks = t.checked ? sortIds([...c.R.picks, id]) : c.R.picks.filter(x => x !== id); track(c.seat, 'pick', {feature:id, on:t.checked, picks:c.R.picks.join(' '), cost:cost(c.R.picks)}); return render(); }
  if (t.dataset.act === 'recall'){ const id = t.dataset.id; c.R.recall = t.checked ? [...new Set([...c.R.recall, id])] : c.R.recall.filter(x => x !== id); track(c.seat, 'answer', {block:'recall', item:id, value:t.checked}); return render(); }
});
document.addEventListener('input', e => {
  const t = e.target, c = cur();
  if (t.id === 'code'){ S.joinCode = t.value; return; }
  if (t.id === 'wf-q'){ S.wf.q = t.value; render(); return; }
  if (t.id === 'fq'){ S.fq = t.value; render(); return; }
  if (t.id === 'peopleq'){ S.peopleQ = t.value; render(); return; }
  if (!c) return;
  if (t.dataset.act === 'text'){
    if (!c.R.compose || !c.R.compose.start){ c.R.compose = {start:Date.now(), keys:0, back:0, pastes:0}; track(c.seat, 'typing_start', {field:'message'}); }
    c.R.text = t.value; snap(c.seat, 'message', t.value);
    const btn = document.querySelector('[data-act="send"]');
    if (btn) btn.disabled = !t.value.trim() || cost(c.R.picks) > BUDGET || S.paused;
    packetLive(c.R, COND[c.T.cond].shared, S.paused, t.value);
  }
  if (t.dataset.act === 'comment'){ c.R.comment = t.value; snap(c.seat, 'accept_comment', t.value); }
  if (t.dataset.act === 'rdraft'){ c.R.rdraft[t.dataset.mid] = t.value; snap(c.seat, 'card_comment:' + t.dataset.mid, t.value); }
});
/* Players cannot copy, cut, paste or drag text. Admin screens are not affected. Every try is logged. */
const isPlayerView = () => !['admin','pin','projector'].includes(S.view);
let clipTimer = null;
function clipNote(msg){ let el = document.getElementById('clipnote'); if (!el){ el = document.createElement('div'); el.id = 'clipnote'; el.className = 'clipnote'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block'; clearTimeout(clipTimer); clipTimer = setTimeout(() => { el.style.display = 'none'; }, 2600); }
function blockClip(e){
  if (!isPlayerView() || e.target.id === 'code' || (e.target.closest && e.target.closest('#demo'))) return;
  e.preventDefault();
  const paste = e.type === 'paste' || e.type === 'drop', src = e.clipboardData || e.dataTransfer, txt = paste ? (src && src.getData('text')) || '' : String(window.getSelection() || '');
  const c = cur(); if (c) track(c.seat, paste ? 'paste_blocked' : 'copy_blocked', {how:e.type, field:e.target.id || e.target.dataset.act || e.target.tagName.toLowerCase(), chars:txt.length, text:txt.slice(0, 500)});
  clipNote(paste ? 'Pasting is turned off. Please type it in your own words.' : 'Copying is turned off. Please put it in your own words.');
}
['copy','cut','paste','drop'].forEach(t => document.addEventListener(t, blockClip, true));
document.addEventListener('dragstart', e => { if (isPlayerView()) e.preventDefault(); }, true);
document.addEventListener('contextmenu', e => { if (isPlayerView() && !/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); }, true);
document.addEventListener('beforeinput', e => { if (isPlayerView() && /insertFromPaste|insertFromDrop/.test(e.inputType || '') && e.target.id !== 'code'){ e.preventDefault(); clipNote('Pasting is turned off. Please type it in your own words.'); } }, true);
document.addEventListener('keydown', e => {
  const c = cur(); if (!c || e.target.id !== 'composer' || !c.R.compose) return;
  if (e.key === 'Backspace' || e.key === 'Delete') c.R.compose.back++; else if (e.key.length === 1) c.R.compose.keys++;
});
document.addEventListener('visibilitychange', () => {
  const c = cur(); if (!c) return;
  if (document.hidden){ S.hiddenAt = Date.now(); track(c.seat, 'left_app', {}); }
  else track(c.seat, 'returned_to_app', {away_ms:Date.now() - (S.hiddenAt || Date.now())});
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'join'){
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (code !== S.settings.classCode){ S.joinErr = "That code doesn't match. Check the code on the screen."; return render(); }
    S.joinErr = ''; const s = addSeat(false); S.me = s.id; S.viewSeat = s.id; S.view = 'seat'; return render();
  }
  if (f === 'pin'){ const v = document.getElementById('pin').value; if (v === ADMIN_PIN){ S.view = 'admin'; S.pinErr = ''; S.showGuide = !GUIDE_SEEN(); } else S.pinErr = 'Wrong PIN.'; return render(); }
  if (f === 'bcast'){ if (S.archive) return flash(RO_MSG, 3500); S.broadcast = document.getElementById('bcast').value.trim(); return render(); }
});
/* Light auto-refresh for screens that show other people's progress */
setInterval(() => {
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (typing) return;
  const s = curSeat();
  if (S.view === 'admin' || S.view === 'projector' || (S.view === 'seat' && s && s.team == null)) render();
}, 3000);


/* Big admin clock: ticks every second without redrawing the page */
setInterval(() => { const el = document.getElementById('admclock'); if (el && S.sessionStart) el.textContent = fmtT(clockNow()); }, 1000);
render();
</script>
